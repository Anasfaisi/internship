apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: task-4-7-pooler-rw
  namespace: anas-c
  labels:
    task: task-4-7
spec:
  cluster:
    name: task-4-7-pg
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
---
