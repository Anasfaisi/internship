apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: anas-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m         # <-- CRITICAL: 100 millicores (0.1 CPU). HPA uses this as 100% baseline.
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi

