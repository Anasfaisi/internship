apiVersion: v1
kind: Pod
metadata:
  name: task-4-7-client
  namespace: anas-c
  labels:
    task: task-4-7
    role: db-client
spec:
  restartPolicy: Always
  containers:
    - name: psql
      image: 'ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie'
      command: ["sleep", "infinity"]
      env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: task-4-7-pg-app
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: task-4-7-pg-app
              key: password
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: task-4-7-pg-app
              key: dbname
        - name: PGSSLMODE
          value: require
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
