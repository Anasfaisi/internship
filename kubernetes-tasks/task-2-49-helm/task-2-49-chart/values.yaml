replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.25"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: myapp.example.com
  path: /
  pathType: Prefix

config:
  appEnv: "development"
  logLevel: "info"
  welcomeMessage: "Hello from Helm!"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"
