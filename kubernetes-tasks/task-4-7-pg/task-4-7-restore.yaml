apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: task-4-7-pg-restore
  namespace: anas-c
  labels:
    task: task-4-7
spec:
  instances: 1
  enableSuperuserAccess: false
  storage:
    size: 5Gi
    storageClass: civo-volume
  resources:
    requests:
      cpu: "100m"
      memory: 512Mi
    limits:
      cpu: "500m"
      memory: 1Gi
  bootstrap:
    recovery:
      source: task-4-7-pg
      recoveryTarget:
        targetTime: "2026-11-18 18:35:11.00000+00"
  externalClusters:
    - name: task-4-7-pg
      barmanObjectStore:
        destinationPath: s3://task-4-7-anas-c-pg/task-4-7-pg
        endpointURL: https://s3.us-east-1.amazonaws.com
        s3Credentials:
          accessKeyId:
            name: task-4-7-backup
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: task-4-7-backup
            key: ACCESS_SECRET_KEY

