
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-2-38-deployment
  namespace: anas-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-2-38
  template:
    metadata:
      labels:
        app: task-2-38
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: task-2-38-config
          volumeMounts:
            - name: secret-volume
              mountPath: /etc/app-secrets
              readOnly: true
      volumes:
        - name: secret-volume
          secret:
            secretName: task-2-38-secret

