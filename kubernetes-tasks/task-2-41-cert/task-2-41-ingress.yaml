apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-2-41-ingress
  namespace: anas-c
spec:
  tls:
    - hosts:
        - example.com
      secretName: task-2-41-tls-secret
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-2-41-svc
                port:
                  number: 80
