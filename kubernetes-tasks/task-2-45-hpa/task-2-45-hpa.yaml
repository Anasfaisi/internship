apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-2-45-hpa
  namespace: anas-c
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-app
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
